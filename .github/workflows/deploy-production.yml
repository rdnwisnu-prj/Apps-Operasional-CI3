name: Deploy Apps Operasional

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-operasional-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deployment production FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Ambil source code
        uses: actions/checkout@v5

      - name: Siapkan PHP dan Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2
          coverage: none

      - name: Instal dependency production
        shell: bash
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --optimize-autoloader

          test -f vendor/autoload.php

          echo "Vendor Composer berhasil dibuat."
          du -sh vendor

      - name: Instal lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Validasi konfigurasi FTP
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_PORT"

      - name: Upload source dan vendor ke production
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          lftp \
            -u "$FTP_USERNAME","$FTP_PASSWORD" \
            -p "$FTP_PORT" \
            "$FTP_SERVER" <<'LFTP_COMMANDS'

          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          set net:max-retries 3
          set net:timeout 60

          mirror --reverse --verbose --parallel=4 \
            --exclude-glob=.git/** \
            --exclude-glob=.github/** \
            --exclude-glob=.gitignore \
            --exclude-glob=.cpanel.yml \
            --exclude-glob=deploy.ps1 \
            --exclude-glob=.env \
            --exclude-glob=*.sql \
            --exclude-glob=*.zip \
            --exclude-glob=*.tar \
            --exclude-glob=*.gz \
            --exclude-glob=application/config/database.php \
            --exclude-glob=application/config/config.php \
            --exclude-glob=application/config/email.php \
            --exclude-glob=application/cache/** \
            --exclude-glob=application/logs/** \
            --exclude-glob=application/sessions/** \
            --exclude-glob=uploads/** \
            --exclude-glob=assets/uploads/** \
            ./ ./

          bye
          LFTP_COMMANDS