name: Deploy Apps Operasional

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-operasional-production
  # Jangan memutus upload FTPS yang sedang berjalan.
  cancel-in-progress: false

jobs:
  deploy:
    name: Deployment production FTPS
    runs-on: ubuntu-latest
    # Initial sync bisa besar. Deploy berikutnya hanya mengirim file berubah.
    timeout-minutes: 240

    steps:
      - name: Ambil source code
        uses: actions/checkout@v5

      - name: Siapkan PHP dan Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2
          coverage: none

      - name: Instal dependency production
        shell: bash
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --optimize-autoloader

          test -f vendor/autoload.php

          echo "Vendor Composer berhasil dibuat."
          du -sh vendor

      - name: Bersihkan file non-runtime dari paket deploy
        shell: bash
        run: |
          set -e

          for dir in application/third_party vendor; do
            if [ -d "$dir" ]; then
              find "$dir" \( \
                -type d \( -iname "test" -o -iname "tests" -o -iname "doc" -o -iname "docs" -o -iname "example" -o -iname "examples" -o -iname "sample" -o -iname "samples" \) \
                -o -type d \( -name ".github" -o -name ".git" \) \
              \) -prune -exec rm -rf {} +

              find "$dir" -type f \( \
                -iname "README*" -o -iname "CHANGELOG*" -o -iname "CONTRIBUTING*" -o -iname "UPGRADE*" \
                -o -iname "phpunit.xml*" -o -iname "phpcs.xml*" -o -iname ".travis.yml" \
              \) -delete
            fi
          done

          echo "Paket deploy setelah cleanup:"
          du -sh application/third_party vendor

      - name: Validasi konfigurasi FTP
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_PORT"

      - name: Sinkronisasi incremental ke production
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          local-dir: ./
          server-dir: ./
          # State disimpan di root production agar daftar file tersinkron
          # tetap tersedia pada runner GitHub yang selalu fresh.
          state-name: .ftp-deploy-sync-state.json
          # Konfigurasi lama mematikan validasi hostname sertifikat FTPS.
          security: loose
          log-level: standard
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/test/**
            **/tests/**
            **/Test/**
            **/Tests/**
            **/docs/**
            **/doc/**
            **/examples/**
            **/example/**
            **/samples/**
            **/sample/**
            **/.travis.yml
            **/phpunit.xml*
            **/phpcs.xml*
            **/README*
            **/CHANGELOG*
            **/CONTRIBUTING*
            **/UPGRADE*
            .gitignore
            .cpanel.yml
            deploy.ps1
            .env
            *.sql
            *.zip
            *.tar
            *.gz
            application/config/database.php
            application/config/config.php
            application/config/email.php
            application/cache/**
            application/logs/**
            application/sessions/**
            uploads/**
            assets/uploads/**
